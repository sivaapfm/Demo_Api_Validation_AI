openapi: 3.0.0
info:
  title: Petstore API
  version: 1.0.0
servers:
  - url: https://petstore.swagger.io/v2
paths:
  /pet/{petId}:
    get:
      summary: Find pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: api_key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
  /pet/findByStatus:
    get:
      summary: Finds Pets by status
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [available, pending, sold]
      security:
        - api_key: []
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid status value
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: api_key
